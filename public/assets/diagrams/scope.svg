<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img"><title>Synthetic scope and acceptance diagram</title><text x="24" y="30" font-family="Public Sans,Arial,sans-serif" font-size="11" fill="#262B26">DEMO — SYNTHETIC DATA</text><text x="24" y="280" font-family="Public Sans,Arial,sans-serif" font-size="11" fill="#262B26">Simulated; non-binding</text><rect x="24" y="61" width="452" height="62" rx="4" fill="#FFFCF5"/><text x="40" y="87" font-family="Public Sans,Arial,sans-serif" font-size="20" fill="#262B26">Research summary</text><text x="40" y="108" font-family="Public Sans,Arial,sans-serif" font-size="14" fill="#262B26">Scope v1 · Deliverable + exclusions</text><path d="M24 147H476M24 193H476M24 239H476" stroke="#262B26" stroke-width="1.5"/><text x="24" y="175" font-family="Public Sans,Arial,sans-serif" font-size="17" fill="#262B26">Defined acceptance criteria</text><text x="24" y="220" font-family="Public Sans,Arial,sans-serif" font-size="17" fill="#262B26">Human reviewer owns acceptance</text><style>path{stroke-dasharray:800;stroke-dashoffset:0;animation:trace 6s ease-in-out infinite}circle{animation:breath 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes trace{0%,12%{stroke-dashoffset:800}50%,100%{stroke-dashoffset:0}}@keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){path,circle{animation:none}}</style></svg>